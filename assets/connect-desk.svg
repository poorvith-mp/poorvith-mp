<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap');
      @keyframes pulseLight {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes borderGlint {
        0%, 100% { stroke: #27272a; }
        50% { stroke: #cda03a; }
      }
      .live-indicator {
        transform-origin: 24px 28px;
        animation: pulseLight 2s ease-in-out infinite;
      }
      .desk-frame {
        animation: borderGlint 6s ease-in-out infinite;
      }
      .channel-row {
        transition: transform 0.2s ease, fill 0.2s ease;
      }
    </style>
  </defs>

  <!-- Container Frame -->
  <rect x="2" y="2" width="536" height="336" rx="16" fill="#131417" class="desk-frame" stroke="#27272a" stroke-width="1.5"/>
  
  <!-- Header with Live Indicator -->
  <circle cx="24" cy="28" r="4.5" fill="#10b981" class="live-indicator"/>
  <text x="36" y="32" fill="#cda03a" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.12em">ENGINEERING COLLABORATION DESK</text>
  
  <text x="24" y="56" fill="#adafb4" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="15">Open for developer tooling, zero-exposure privacy, &amp; autonomous agent architectures.</text>

  <!-- Channel 1: Email / Direct Desk -->
  <g transform="translate(18, 70)" class="channel-row">
    <rect width="504" height="44" rx="8" fill="#1c1d22" stroke="#2a2c33" stroke-width="1"/>
    <!-- Email Logo -->
    <g transform="translate(14, 11)">
      <rect width="22" height="22" rx="4" fill="#08090b" stroke="#cda03a" stroke-width="1.2"/>
      <path d="M4 6h14v10H4z" fill="none" stroke="#cda03a" stroke-width="1.2"/>
      <path d="M4 6l7 5 7-5" stroke="#cda03a" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <text x="46" y="22" fill="#f7f7f5" font-family="'Geist', sans-serif" font-size="13" font-weight="600">Direct Desk</text>
    <text x="46" y="35" fill="#adafb4" font-family="'Geist Mono', monospace" font-size="11">contact@poorvithmp.com</text>
    <rect x="408" y="10" width="84" height="24" rx="6" fill="#cda03a"/>
    <text x="450" y="26" fill="#08090b" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">SEND EMAIL</text>
  </g>

  <!-- Channel 2: Portfolio -->
  <g transform="translate(18, 122)" class="channel-row">
    <rect width="504" height="44" rx="8" fill="#1c1d22" stroke="#2a2c33" stroke-width="1"/>
    <!-- Website Logo (Globe) -->
    <g transform="translate(14, 11)">
      <circle cx="11" cy="11" r="10" fill="#08090b" stroke="#cda03a" stroke-width="1.2"/>
      <path d="M1 11h20M11 1a14 14 0 0 1 3.5 10 14 14 0 0 1-3.5 10 14 14 0 0 1-3.5-10A14 14 0 0 1 11 1z" stroke="#cda03a" stroke-width="1.2"/>
    </g>
    <text x="46" y="22" fill="#f7f7f5" font-family="'Geist', sans-serif" font-size="13" font-weight="600">Portfolio &amp; Theatre</text>
    <text x="46" y="35" fill="#adafb4" font-family="'Geist Mono', monospace" font-size="11">poorvithmp.com</text>
    <rect x="408" y="10" width="84" height="24" rx="6" fill="#2a2c33" stroke="#4f5259" stroke-width="1"/>
    <text x="450" y="26" fill="#ffe48b" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">EXPLORE</text>
  </g>

  <!-- Channel 3: LinkedIn -->
  <g transform="translate(18, 174)" class="channel-row">
    <rect width="504" height="44" rx="8" fill="#1c1d22" stroke="#2a2c33" stroke-width="1"/>
    <!-- LinkedIn Logo -->
    <g transform="translate(14, 11)">
      <rect width="22" height="22" rx="4" fill="#0077B5"/>
      <path d="M4.5 9h2.5v7.5H4.5zM5.75 5.5a1.4 1.4 0 1 1 0 2.8 1.4 1.4 0 0 1 0-2.8zM9 9h2.4v1h.03a2.6 2.6 0 0 1 2.37-1.3c2.53 0 3 1.67 3 3.84v3.96h-2.5v-3.5c0-.84-.02-1.92-1.17-1.92-1.17 0-1.35.91-1.35 1.86v3.56H9V9z" fill="#ffffff"/>
    </g>
    <text x="46" y="22" fill="#f7f7f5" font-family="'Geist', sans-serif" font-size="13" font-weight="600">LinkedIn</text>
    <text x="46" y="35" fill="#adafb4" font-family="'Geist Mono', monospace" font-size="11">in/poorvithmp</text>
    <rect x="408" y="10" width="84" height="24" rx="6" fill="#0077B5"/>
    <text x="450" y="26" fill="#ffffff" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">CONNECT</text>
  </g>

  <!-- Channel 4: X (Twitter) -->
  <g transform="translate(18, 226)" class="channel-row">
    <rect width="504" height="44" rx="8" fill="#1c1d22" stroke="#2a2c33" stroke-width="1"/>
    <!-- X Logo -->
    <g transform="translate(14, 11)">
      <rect width="22" height="22" rx="4" fill="#08090b" stroke="#4f5259" stroke-width="1"/>
      <path d="M15.5 5h2l-4.37 5 5.14 6.8h-4.03l-3.15-4.13-3.61 4.13h-2l4.68-5.35L5.27 5h4.13l2.85 3.77L15.5 5zm-.7 10.6h1.1L8.27 6.33H7.08l7.72 9.27z" fill="#ffffff"/>
    </g>
    <text x="46" y="22" fill="#f7f7f5" font-family="'Geist', sans-serif" font-size="13" font-weight="600">X (Twitter)</text>
    <text x="46" y="35" fill="#adafb4" font-family="'Geist Mono', monospace" font-size="11">@poorvith_mp</text>
    <rect x="408" y="10" width="84" height="24" rx="6" fill="#2a2c33" stroke="#4f5259" stroke-width="1"/>
    <text x="450" y="26" fill="#ffffff" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">FOLLOW</text>
  </g>

  <!-- Channel 5: GitHub -->
  <g transform="translate(18, 278)" class="channel-row">
    <rect width="504" height="44" rx="8" fill="#1c1d22" stroke="#2a2c33" stroke-width="1"/>
    <!-- GitHub Logo -->
    <g transform="translate(14, 11)">
      <rect width="22" height="22" rx="4" fill="#08090b" stroke="#cda03a" stroke-width="1"/>
      <path fill-rule="evenodd" clip-rule="evenodd" d="M11 2C6.03 2 2 6.03 2 11.01c0 3.98 2.58 7.36 6.15 8.55.45.08.61-.2.61-.43 0-.21-.01-.78-.01-1.53-2.5.54-3.03-1.21-3.03-1.21-.41-1.04-1-1.32-1-1.32-.82-.56.06-.55.06-.55.9.06 1.38.93 1.38.93.8 1.38 2.11.98 2.62.75.08-.58.31-.98.57-1.2-2-.23-4.1-1-4.1-4.46 0-.98.35-1.79.93-2.42-.09-.23-.4-1.14.09-2.38 0 0 .76-.24 2.47.92a8.6 8.6 0 0 1 4.5 0c1.72-1.16 2.47-.92 2.47-.92.49 1.24.18 2.15.09 2.38.58.63.93 1.44.93 2.42 0 3.46-2.1 4.23-4.11 4.45.32.28.61.83.61 1.67 0 1.2-.01 2.17-.01 2.47 0 .24.16.52.62.43 3.57-1.19 6.15-4.57 6.15-8.55C20 6.03 15.97 2 11 2z" fill="#cda03a"/>
    </g>
    <text x="46" y="22" fill="#f7f7f5" font-family="'Geist', sans-serif" font-size="13" font-weight="600">GitHub Repositories</text>
    <text x="46" y="35" fill="#adafb4" font-family="'Geist Mono', monospace" font-size="11">poorvith-mp (30+ Repos)</text>
    <rect x="408" y="10" width="84" height="24" rx="6" fill="#cda03a"/>
    <text x="450" y="26" fill="#08090b" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">BROWSE</text>
  </g>
</svg>
