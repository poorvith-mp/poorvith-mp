<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AIScrubber</title>
  <desc id="desc">Scrub sensitive data before it reaches an AI.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@600;700&amp;family=Geist+Mono:wght@500&amp;display=swap');
      @keyframes scan {
        0% { transform: translateY(0px); opacity: 0.8; }
        50% { transform: translateY(220px); opacity: 1; }
        100% { transform: translateY(0px); opacity: 0.8; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      .scanner-beam {
        animation: scan 4s ease-in-out infinite;
      }
      .live-dot {
        animation: blink 1.8s ease-in-out infinite;
      }
    </style>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0v80" fill="none" stroke="#12362B"/>
    </pattern>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#020617"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity=".35"/>
  <text x="88" y="280" fill="#F8FAFC" font-family="'Geist', sans-serif" font-size="88" font-weight="700">AIScrubber</text>
  <text x="92" y="348" fill="#10B981" font-family="'Geist Mono', monospace" font-size="26">Scrub sensitive data before it reaches an AI.</text>
  
  <!-- Right Graphic Deck -->
  <g transform="translate(0, 0)">
    <path d="M780 132h-48v366h48M1070 132h48v366h-48" fill="none" stroke="#10B981" stroke-width="15"/>
    <g fill="#1E293B">
      <rect x="800" y="190" width="240" height="22" rx="5"/>
      <rect x="800" y="248" width="172" height="22" rx="5"/>
      <rect x="800" y="306" width="240" height="22" rx="5"/>
      <rect x="800" y="364" width="190" height="22" rx="5"/>
      <rect x="800" y="422" width="240" height="22" rx="5"/>
    </g>
    <g fill="#10B981">
      <rect x="875" y="248" width="97" height="22" rx="5"/>
      <rect x="842" y="364" width="112" height="22" rx="5"/>
    </g>
    <!-- Scanning Laser Animation -->
    <g class="scanner-beam">
      <rect x="760" y="180" width="330" height="30" fill="url(#beamGrad)"/>
      <line x1="750" y1="210" x2="1100" y2="210" stroke="#10B981" stroke-width="3"/>
    </g>
    <circle cx="1090" cy="140" r="5" fill="#10B981" class="live-dot"/>
  </g>
</svg>
