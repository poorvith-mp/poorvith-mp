<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SafeGen</title>
  <desc id="desc">Generate strong credentials on your device.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@600;700&amp;family=Geist+Mono:wght@500&amp;display=swap');
      @keyframes spin {
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseDial {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      .entropy-dial {
        transform-origin: 910px 250px;
        animation: spin 20s linear infinite;
      }
      .pin-pulse {
        transform-origin: 908px 475px;
        animation: pulseDial 2s ease-in-out infinite;
      }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#F5F2E8"/>
  <rect x="42" y="42" width="1116" height="546" rx="20" fill="none" stroke="#D8D4CA" stroke-width="2"/>
  <text x="90" y="285" fill="#101116" font-family="'Geist', sans-serif" font-size="92" font-weight="700">SafeGen</text>
  <text x="94" y="350" fill="#101116" font-family="'Geist Mono', monospace" font-size="26">Generate strong credentials on your device.</text>
  
  <circle cx="910" cy="250" r="122" fill="none" stroke="#B7F34A" stroke-width="34" stroke-dasharray="50 13" class="entropy-dial"/>
  <path d="M814 390h194" stroke="#101116" stroke-width="30" stroke-linecap="round"/>
  <path d="M832 390h158" stroke="#B7F34A" stroke-width="5" stroke-dasharray="4 14"/>
  <path d="M790 475h245" stroke="#D8D4CA" stroke-width="10" stroke-linecap="round"/>
  <path d="M790 475h118" stroke="#B7F34A" stroke-width="10" stroke-linecap="round"/>
  <circle cx="908" cy="475" r="18" fill="#F5F2E8" stroke="#B7F34A" stroke-width="6" class="pin-pulse"/>
</svg>
