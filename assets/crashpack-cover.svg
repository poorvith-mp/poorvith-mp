<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">crashpack</title>
  <desc id="desc">Everything your bug report needs, in one command.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@600;700&amp;family=Geist+Mono:wght@500;700&amp;display=swap');
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes badgePulse {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.45; }
      }
      .cursor { animation: blinkCursor 1s infinite; }
      .copied-badge { animation: badgePulse 2s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#08090B"/>
  <text x="82" y="270" fill="#F8FAFC" font-family="'Geist', sans-serif" font-size="88" font-weight="700">crashpack</text>
  <text x="86" y="340" fill="#F59E0B" font-family="'Geist Mono', monospace" font-size="25">Everything your bug report needs, in one command.</text>
  
  <g transform="translate(740 120)">
    <rect width="380" height="390" rx="16" fill="#131417" stroke="#27272A" stroke-width="3"/>
    <rect x="24" y="24" width="332" height="42" rx="8" fill="#1F2125"/>
    <circle cx="50" cy="45" r="7" fill="#EF4444"/>
    <circle cx="72" cy="45" r="7" fill="#F59E0B"/>
    <circle cx="94" cy="45" r="7" fill="#10B981"/>
    <rect x="120" y="38" width="180" height="14" rx="4" fill="#27272A"/>
    <g transform="translate(24 90)">
      <rect width="332" height="48" rx="8" fill="#18181B" stroke="#F59E0B" stroke-width="2"/>
      <text x="16" y="30" fill="#F59E0B" font-family="'Geist Mono', monospace" font-size="14" font-weight="700">$ npx crashpack</text>
      <rect x="146" y="16" width="9" height="18" fill="#F59E0B" class="cursor"/>
      <g transform="translate(0 70)">
        <rect width="332" height="180" rx="8" fill="#18181B"/>
        <path d="M20 25h140M20 48h220M20 71h180M20 94h260M20 117h190M20 140h120" stroke="#71717A" stroke-width="4" stroke-linecap="round"/>
        <path d="M20 48h90" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
        <path d="M20 94h110" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
        <rect x="240" y="130" width="72" height="32" rx="6" fill="#10B981" class="copied-badge"/>
        <text x="254" y="151" fill="#10B981" font-family="'Geist Mono', monospace" font-size="12" font-weight="700">COPIED</text>
      </g>
    </g>
  </g>
</svg>
